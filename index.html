<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пиксириус</title>
<link rel="stylesheet" href="css/style.css">
<script>
// На статическом хостинге (GitHub Pages) нет заголовков COOP/COEP, без них
// нет SharedArrayBuffer и потоков симуляции. Их добавляет сервис-воркер
// coi-sw.js: ставим его и один раз перезагружаемся, чтобы страница пришла
// уже через него. Локально (tools/serve.js шлёт заголовки сам) страница
// изолирована сразу, и воркер не ставится. Не вышло — игра идёт в одном
// потоке, как и раньше без заголовков; метка в sessionStorage не даёт
// перезагружаться по кругу.
(function () {
  if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('coi-sw.js').then(function (reg) {
    if (navigator.serviceWorker.controller) return;
    try { if (sessionStorage.getItem('pixCoiReload')) return; sessionStorage.setItem('pixCoiReload', '1'); } catch (e) { return; }
    navigator.serviceWorker.ready.then(function () { location.reload(); });
  }).catch(function () {});
})();
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
  </div>
  <div id="panel">
    <div id="tools">
      <button id="btnPause" class="tool-btn" type="button" title="Пауза"></button>
      <button id="btnClear" class="tool-btn" type="button" title="Очистить"></button>
      <button id="btnSave" class="tool-btn" type="button" title="Сохранить"></button>
      <button id="btnLoad" class="tool-btn" type="button" title="Загрузить"></button>
      <input id="fileLoad" type="file" accept=".pixsav,application/json" hidden>
    </div>
    <div id="paletteTabs"></div>
    <div id="palette"></div>
    <div id="statusLabel"></div>
  </div>
  <div id="materialInfo"></div>
</div>
<script>
// Скрипты подключаются не обычными тегами, а этим загрузчиком — ради
// уникальной метки ?v= в адресе каждого файла. Без неё браузер (и
// обычный Ctrl+R, и кнопка "обновить") честно отдаёт закэшированную
// копию: статический сервер не шлёт Cache-Control, браузер сам решает,
// сколько файл считать свежим, и после правки кода страница ещё долго
// крутит СТАРУЮ версию — правки просто не появляются, хотя на диске и
// на сервере всё новое. Метка делает адрес каждый раз новым, поэтому
// кэш промахивается и файл всегда грузится заново.
//
// Загрузчик стоит в конце <body> (как стояли сами теги): к моменту его
// выполнения документ уже разобран, и код может сразу обращаться к
// canvas и кнопкам панели.
//
// async = false обязателен: у скрипта, созданного из JS, async по
// умолчанию ВКЛЮЧЁН, и файлы выполнились бы в случайном порядке — кто
// раньше скачался. Явное false возвращает выполнение строго в порядке
// добавления, как у обычных тегов: data/ определяет таблицы элементов,
// sim/core.js объявляет Sim, остальные sim/*.js дописывают в него методы
// (extendSim), main.js опирается на всё остальное.
(function () {
  var files = [
    'js/data/elements.js',
    'js/data/composition.js',
    'js/data/oxides.js',
    'js/sim/core.js',
    'js/sim/stability.js',
    'js/sim/wind.js',
    'js/sim/heat.js',
    'js/sim/movement.js',
    'js/sim/reactions.js',
    'js/sim/composition.js',
    'js/sim/chemistry.js',
    'js/sim/oxides.js',
    'js/sim/explosion.js',
    'js/sim/mud.js',
    'js/sim/alloys.js',
    'js/sim/landing.js',
    'js/sim/sleep.js',
    'js/sim/threads.js',
    'js/sim/human.js',
    'js/sim/protagonist.js',
    'js/sim/charges.js',
    'js/sim/spawns.js',
    'js/sim/lockstep.js',
    'js/sim/colonist.js',
    'js/sim/painting.js',
    'js/sim/persistence.js',
    'js/render.js',
    'js/render-gl.js',
    'js/input.js',
    'js/inspect.js',
    'js/play.js',
    'js/mp-wire.js',
    'js/net.js',
    'js/lobby.js',
    'js/main.js'
  ];
  var v = Date.now();
  // Потокам симуляции (js/sim/worker.js) нужны те же скрипты с той же
  // меткой: всё до рендера, см. main.js.
  window.PIX_SCRIPTS = files;
  window.PIX_V = v;
  for (var i = 0; i < files.length; i++) {
    var s = document.createElement('script');
    s.src = files[i] + '?v=' + v;
    s.async = false;
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
