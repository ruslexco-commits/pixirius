<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пиксилиус</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
  </div>
  <div id="panel">
    <div id="tools">
      <button id="btnPause" class="tool-btn" type="button" title="Пауза"></button>
      <button id="btnClear" class="tool-btn" type="button" title="Очистить"></button>
      <button id="btnSave" class="tool-btn" type="button" title="Сохранить"></button>
      <button id="btnLoad" class="tool-btn" type="button" title="Загрузить"></button>
      <input id="fileLoad" type="file" accept=".pixsav,application/json" hidden>
    </div>
    <div id="paletteTabs"></div>
    <div id="palette"></div>
    <div id="statusLabel"></div>
  </div>
  <div id="materialInfo"></div>
</div>
<script src="js/elements.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
